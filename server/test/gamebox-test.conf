# Copie de test de Marvel Champions Table (dossier /test/ du site, npm run build:test) : réservée aux personnes qui
# ont un identifiant et son mot de passe (authentification HTTP de base : le navigateur les demande dans sa propre
# fenêtre, puis les joint à chaque demande du dossier). Le site n'est servi qu'en https : ils ne circulent jamais en
# clair. Les mots de passe sont dans test.htpasswd, hors de la racine web, créé avec htpasswd (server/README.md,
# partie 8).
#
# À installer dans la configuration d'Apache, pas dans le dossier : sur le VPS, le .htaccess de dist-test/ n'a pas été
# appliqué (fichier caché oublié à l'envoi, ou .htaccess non lus : AllowOverride None), et une protection dans la
# configuration ne dépend pas de ce qu'on envoie dans /test/.
#   /etc/apache2/conf-available/gamebox-test.conf, puis sudo a2enconf gamebox-test && sudo systemctl reload apache2
#
# Les deux chemins ci-dessous sont ceux du VPS actuel : à adapter sur un autre serveur. <Directory> désigne un
# dossier du disque, comparé lettre par lettre au chemin qu'Apache construit (DocumentRoot + adresse demandée), sans
# suivre les liens symboliques. S'il ne correspond pas (autre DocumentRoot, dossier renommé, DocumentRoot qui passe
# par un lien), la règle ne s'applique à rien et /test/ est ouvert à tous, sans aucune erreur : configtest répond
# quand même Syntax OK. Le vrai DocumentRoot : grep -ri documentroot /etc/apache2/sites-enabled/. Après tout
# changement sur le serveur, vérifier que /test/ répond 401 sans mot de passe (server/README.md, partie 8).
<Directory /home/prod/WWW/base/test>
    AuthType Basic
    AuthName "Marvel Champions Table - copie de test"
    AuthUserFile /home/prod/gamebox-private/test.htpasswd
    Require valid-user
</Directory>
